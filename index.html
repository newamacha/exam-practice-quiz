<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exam Practice Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column of question cards under a sticky set picker + score bar */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202b; --muted:#5d6876; --line:#d9dee5;
  --accent:#1f5f8b; --accent-soft:#e3eef6;
  --ok:#1b7f45; --ok-bg:#e4f4ea; --bad:#c2352b; --bad-bg:#fbe7e5; --code-bg:#eef1f4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --fg:#e4e9ef; --muted:#9aa6b4; --line:#2c3743;
  --accent:#6fb3e0; --accent-soft:#1d3346;
  --ok:#4cc27e; --ok-bg:#163525; --bad:#f07067; --bad-bg:#3d1d1b; --code-bg:#0f1419; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --fg:#e4e9ef; --muted:#9aa6b4; --line:#2c3743;
  --accent:#6fb3e0; --accent-soft:#1d3346;
  --ok:#4cc27e; --ok-bg:#163525; --bad:#f07067; --bad-bg:#3d1d1b; --code-bg:#0f1419; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--sans);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header .wrap{padding-block:12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
header .wrap>*{min-width:0}
.top select{flex:1 1 260px;width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;justify-content:space-between}
h1{font-size:1.05rem;margin:0;font-weight:700;letter-spacing:.01em;text-wrap:balance}
h1 small{display:block;font-size:.78rem;font-weight:500;color:var(--muted);letter-spacing:0}
select{font:inherit;font-size:.95rem;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);max-width:100%;min-width:0}
.subs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.subs button{flex:none;font:inherit;font-size:.82rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:5px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.subs button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--fg)}
.bar{flex:1 1 140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex;min-width:100px}
.bar i{display:block;height:100%}
.bar .c{background:var(--ok)} .bar .w{background:var(--bad)}
.reset{font:inherit;font-size:.8rem;border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;padding:3px 9px;cursor:pointer}
.reset.arm{border-color:var(--bad);color:var(--bad)}
main .wrap{padding-block:18px 60px;display:grid;gap:14px}
.intro{color:var(--muted);font-size:.92rem;margin:0}
h2{font-size:1rem;margin:14px 0 0;color:var(--accent);text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 16px 14px;min-width:0}
.meta{font-size:.78rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-bottom:6px;font-variant-numeric:tabular-nums}
.meta .id{font-weight:700;color:var(--fg);font-size:.85rem}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 7px;font-weight:500}
.stem p{margin:0 0 8px}
pre{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:13.5px/1.5 var(--mono);margin:6px 0 10px}
code{font-family:var(--mono);font-size:.9em;background:var(--code-bg);border-radius:4px;padding:0 4px}
pre code{background:none;padding:0;font-size:inherit}
.tw{overflow-x:auto;margin:6px 0 10px}
table{border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:left}
th{background:var(--code-bg)}
.opts{display:grid;gap:7px;margin-top:6px}
.opt{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;min-width:0}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt:disabled{cursor:default}
.box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;font-weight:700;font-size:15px;line-height:1;margin-top:1px}
.opt .t{min-width:0;overflow-wrap:anywhere}
.opt .l{font-weight:600;margin-right:4px}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.done .opt:not(.right):not(.wrong){opacity:.6}
.fb{margin-top:10px;border-radius:8px;padding:10px 12px;font-size:.93rem}
.fb p{margin:0 0 6px} .fb p:last-child{margin:0}
.fb.bad{background:var(--bad-bg);border-left:4px solid var(--bad)}
.fb.ok{background:var(--ok-bg);border-left:4px solid var(--ok)}
.fb .h{font-weight:700;margin-bottom:4px}
.fb.bad .h{color:var(--bad)} .fb.ok .h{color:var(--ok)}
details summary{cursor:pointer;color:var(--muted);font-size:.88rem;margin-top:2px}
details[open] summary{margin-bottom:6px}
.result{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-variant-numeric:tabular-nums}
.result b.pass{color:var(--ok)} .result b.fail{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .15s,background .15s}}
@media (max-width:480px){body{font-size:15px}.card{padding:13px 12px 12px}}
</style>
</head><body>

m","tulips.tulipshrm.com","app.tulipshrm.com","login.tulipshrm.com"],"a":2},{"q":"What is the website for our HR system to get information about our system?","o":["www.tulipshrm.com","www.eattendance.com"],"a":0},{"q":"What should we do if customer (who is not administrator) says he/she has the forgotten password?","o":["Ignore.","Tell them to click the forgot password and check email and reset password.","Tell Contact to contact their administrator.","We should reset the password and send them a new password."],"a":2},{"q":"What should you do when a client says they need a custom sub domain?","o":["Tell the programmer to create the sub domain","Tell the system administrator to create the sub domain","Inform management and take approval then talk to system administrator","Tell the client that we don't create sub domains."],"a":2},{"q":"When a customer asks for a new feature what should you do?","o":["Don't respond at all","Tell the client that I will discuss with the team and get back.","Tell we don't have that feature and can't make","Instruct the developer to develop that feature immediately."],"a":1}]},{"t":"ISMS Knowledge Assessment","qs":[{"q":"A build with a Critical/High vulnerability in its own code:","o":["Is released anyway","Is not released without formal risk acceptance first","Is deleted","Is ignored"],"a":1},{"q":"A data subject request from a client’s employee reaching Tulips directly is:","o":["Answered directly by Tulips","Passed to the client tenant, with Tulips assisting","Ignored","Published"],"a":1},{"q":"A departing client’s TulipsHRM data export grace period is:","o":["7 days","30 days","90 days","1 year"],"a":2},{"q":"A device lost while working from home must be reported:","o":["Immediately, as a security incident (same obligation as in the office)","Only if it held data","Within a month","Never"],"a":0},{"q":"A downed TulipsHRM production server is classified by default as:","o":["Low","Medium","High","Critical"],"a":3},{"q":"A first formal rong unique password with WPA2/WPA3","An open network","No password"],"a":1},{"q":"Honest, good-faith incident reports (including your own mistakes) are:","o":["Punished","Protected from retaliation","Ignored","Made public"],"a":1},{"q":"How many classification levels does Tulips use?","o":["2","3","4","5"],"a":2},{"q":"How many members does the Security Board have?","o":["2","3","4","10"],"a":2},{"q":"How often is the Information Security Policy reviewed at minimum?","o":["At least once a year","Every 5 years","Only after an incident","Never"],"a":0},{"q":"If unsure of a classification, you should:","o":["Treat it as Public","Treat it as the higher candidate level","Leave it unlabelled","Ask the client"],"a":1},{"q":"In the “Who Does What” model, functions like IT/HR/facilities are:","o":["Held collectively by the Security Board (no separate role-holders)","Outsourced entirely","Held by the client","Not covered"],"a":0},{"q":"In TulipsHRM, for client employee data Tulips acts as a:","o":["Controller","Processor","Regulator","Data subject"],"a":1},{"q":"Incident records and evidence packages are retained for at least:","o":["6 months","1 year","5 years","30 days"],"a":2},{"q":"Independent external penetration testing of TulipsHRM happens at least:","o":["Never","Once a year and after major architectural changes","Every decade","Only if a client asks"],"a":1},{"q":"Independent penetration testing of TulipsHRM is aimed for at least:","o":["Every 5 years","Once a year and before major releases","Never","Monthly"],"a":1},{"q":"Internal authenticated scans on internet-facing systems and TulipsHRM production run at least:","o":["Weekly","Yearly","Never","Every 5 years"],"a":0},{"q":"Likelihood and impact are each scored on a scale of:","o":["1–3","1–5","1–10","1–100"],"a":1},{"q":"Lowering a Restricted classification needs:","o":["Anyone’s approval","Asset owner sign-off AND the Lead, Cybersecurity & DevSecOps’s agreement","No approval","The client’s approval"],"a":1},{"q const L = 'ABCDEFGH';
const store = {
  get(k){ try{ const v = localStorage.getItem('examq:'+k); return v===null?null:+v }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem('examq:'+k, v) }catch(e){} },
  del(k){ try{ localStorage.removeItem('examq:'+k) }catch(e){} }
};
const mem = {};
const pick = id => (id in mem) ? mem[id] : store.get(id);
const $ = s => document.querySelector(s);
const esc = t => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };

DATA.forEach((e, i) => e.qs.forEach((q, j) => q.id = i+'.'+j));
const sel = $('#set');
DATA.forEach((e, i) => sel.append(new Option(`${e.t} (${e.qs.length})`, i)));
sel.onchange = () => location.hash = 'exam' + (+sel.value + 1);
window.addEventListener('hashchange', route);

let cur = null;
function route(){
  const m = location.hash.match(/^#exam(\d+)$/), n = m && DATA[m[1]-1] ? m[1]-1 : 0;
  const e = DATA[n], list = $('#list'); sel.value = n; list.innerHTML = '';
  list.insertAdjacentHTML('beforeend', `<p class="intro"><b>${esc(e.t)}</b> · ${e.qs.length} questions. Tick an option to check it.</p>`);
  e.qs.forEach((q, k) => list.append(card(q, 'Q'+(k+1))));
  list.insertAdjacentHTML('beforeend', '<div class="result" id="result"></div>');
  cur = e; score(); window.scrollTo(0, 0);
}

function card(q, label){
  const el = document.createElement('article'); el.className = 'card'; el.id = 'q-'+q.id;
  el.innerHTML = `<div class="meta"><span class="id">${label}</span><span>1 mark</span></div>
    <div class="stem"><p>${esc(q.q)}</p></div>
    <div class="opts" role="group" aria-label="Options for ${label}">${q.o.map((o,i)=>`<button class="opt" type="button" data-i="${i}"><span class="box" aria-hidden="true"></span><span class="t"><span class="l">${L[i]}.</span>${esc(o)}</span></button>`).join('')}</div>`;
  el.querySelectorAll('.opt').forEach(b => b.onclick = () => { mem[q.id] = +b.dataset.i; store.set(q.id, b.dataset.i); paint(el, q); score(); });
  paint(el, q); return el;
}
function paint(el, q){
  const p = pick(q.id), btns = el.querySelectorAll('.opt'), old = el.querySelector('.fb'); old && old.remove();
  btns.forEach(b => { b.className = 'opt'; b.disabled = p !== null; b.querySelector('.box').textContent = ''; b.removeAttribute('aria-label'); });
  el.classList.toggle('done', p !== null);
  if (p === null) return;
  const right = btns[q.a]; right.classList.add('right'); right.querySelector('.box').textContent = '✓';
  const fb = document.createElement('div');
  if (p === q.a){
    right.setAttribute('aria-label', 'Your answer, correct');
    fb.className = 'fb ok'; fb.innerHTML = '<div class="h">✓ Correct</div>';
  } else {
    const w = btns[p]; w.classList.add('wrong'); w.querySelector('.box').textContent = '✗'; w.setAttribute('aria-label', 'Your answer, wrong');
    fb.className = 'fb bad'; fb.innerHTML = `<div class="h">✗ Wrong. Correct answer: ${L[q.a]}. ${esc(q.o[q.a])}</div>`;
  }
  el.append(fb);
}
function score(){
  const qs = cur.qs, n = qs.length; let a = 0, c = 0;
  qs.forEach(q => { const p = pick(q.id); if (p !== null){ a++; if (p === q.a) c++; } });
  $('#score').innerHTML = `<span>Answered <b>${a}/${n}</b></span><span>Correct <b>${c}</b> · Wrong <b>${a-c}</b></span><span>Score <b>${a?Math.round(c*100/a)+'%':'–'}</b></span>
    <span class="bar" aria-hidden="true"><i class="c" style="width:${c*100/n}%"></i><i class="w" style="width:${(a-c)*100/n}%"></i></span>
    <button class="reset" id="reset" type="button">Reset this exam</button>`;
  const r = $('#reset'); let armed = false;
  r.onclick = () => {
    if (!armed){ armed = true; r.classList.add('arm'); r.textContent = 'Tap again to clear your answers'; setTimeout(()=>{ if (armed){ armed=false; r.classList.remove('arm'); r.textContent='Reset this exam'; } }, 3500); return; }
    qs.forEach(q => { delete mem[q.id]; store.del(q.id); });
    route();
  };
  $('#result').innerHTML = a < n ? `${n-a} questions left. Your result appears here when all ${n} are answered.`
    : `Result: <b class="${c*2>=n?'pass':'fail'}">${c}/${n} · ${Math.round(c*100/n)}%</b>`;
}
route();
</script>
